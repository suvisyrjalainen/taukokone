<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Arvo lyhyt liikunta- tai rauhoittumistauko.">
  <title>Taukokone</title>
  <link rel="stylesheet" href="tyyli.css">
  <script src="tauot.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="nimi">◷ Taukokone</p>
      <h1>Hetki <em>tauolle.</em></h1>
      <p>Kaipaatko vähän liikettä vai rauhallisen hetken? Valitse, mikä sopii tähän hetkeen.</p>
    </header>
    <form id="taukokone">
      <fieldset>
        <legend>Valitse tauon tavoite</legend>
        <div class="valinnat">
          <label>
            <input type="radio" name="tavoite" value="liike" checked>
            <span><strong>Liiku hetki</strong><small>Kevyttä liikettä paikallaan tai kävellen</small></span>
          </label>
          <label>
            <input type="radio" name="tavoite" value="rauha">
            <span><strong>Rauhoitu</strong><small>Lyhyt hetki keskittymiseen tai lepoon</small></span>
          </label>
        </div>
      </fieldset>
      <div class="ika">
        <label for="ika">Ikä vuosina <small>(valinnainen)</small></label>
        <input id="ika" type="number" min="1" max="120" step="1" inputmode="numeric" aria-describedby="ika-ohje">
        <p id="ika-ohje">Ikä auttaa valitsemaan sopivan tauon. Se käsitellään vain selaimessasi.</p>
      </div>
      <section class="kortti" aria-labelledby="tulos-otsikko">
        <h2 id="tulos-otsikko">Sinun taukosi</h2>
        <div id="tulos" role="status" aria-atomic="true">
          <p id="aika" hidden></p>
          <p id="tehtava">Arvo itsellesi pieni tauko.</p>
        </div>
        <button type="submit">Arvo tauko</button>
        <noscript><p>Tauon arpominen vaatii selaimen JavaScriptin.</p></noscript>
      </section>
    </form>
  </main>
</body>
</html>
